# Local development services: PostgreSQL + Mailpit.
# The Laravel app itself runs on the host with `composer run dev`.
#
#   docker compose up -d     start
#   docker compose down      stop (data is kept)
#   docker compose down -v   stop and delete the database
#
# The values below match .env.example. They are local development credentials only.
# Ports are bound to 127.0.0.1, so the services are not reachable from the network.

services:
  pgsql:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tracker_abonamente
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
    ports:
      # 5433 on the host, so it does not clash with a locally installed PostgreSQL on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker_abonamente"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP: Laravel sends mail here
      - "127.0.0.1:8025:8025"   # Web inbox: http://localhost:8025

volumes:
  pgsql-data:
