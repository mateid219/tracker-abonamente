# Tracker Abonamente: full stack in Docker.
#
#   docker compose up -d --build                    start (http://localhost:8080)
#   docker compose --profile tunnel up -d --build   start + public HTTPS link via Cloudflare
#   docker compose down                             stop (data is kept)
#   docker compose down -v                          stop and delete all data
#
# Only values that differ from Laravel's defaults are set here.

name: tracker-abonamente

x-app: &app
  build:
    context: .
    target: app
  image: tracker-abonamente-app
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage   # application key, generated on first start
  environment: &app-env
    APP_NAME: "Tracker Abonamente"
    APP_URL: http://localhost:8080
    APP_LOCALE: ro
    LOG_CHANNEL: stderr               # logs visible with: docker compose logs app
    DB_CONNECTION: pgsql
    DB_HOST: pgsql
    DB_DATABASE: tracker_abonamente
    DB_USERNAME: tracker
    DB_PASSWORD: tracker
    SESSION_ENCRYPT: "true"
    QUEUE_CONNECTION: sync            # nothing runs in the background, no worker needed
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: "1025"
    BROADCAST_CONNECTION: reverb
    REVERB_APP_ID: "100001"
    REVERB_APP_KEY: tracker-abonamente-key
    REVERB_APP_SECRET: tracker-abonamente-secret
    REVERB_HOST: reverb
    REVERB_PORT: "8080"
    REVERB_SCHEME: http

services:
  # Nginx: the only entry point (port 8080). Forwards /app/* to reverb and /mail to mailpit.
  web:
    build:
      context: .
      target: web
    image: tracker-abonamente-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - app
      - reverb
      - mailpit

  # Laravel (PHP-FPM). On start: waits for the database, runs migrations, seeds demo accounts.
  app:
    <<: *app
    environment:
      <<: *app-env
      CONTAINER_ROLE: app
    depends_on:
      - pgsql

  # WebSocket server (Laravel Reverb): live updates between open browser windows.
  reverb:
    <<: *app
    command: ["php", "artisan", "reverb:start"]
    depends_on:
      - app

  pgsql:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tracker_abonamente
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
    volumes:
      - pgsql-data:/var/lib/postgresql/data

  # Catches every email the app sends. Inbox: <app address>/mail
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_WEBROOT: /mail
      MP_UI_AUTH: "tester:${MAILPIT_PASSWORD:-tester}"

  # Public HTTPS link (random *.trycloudflare.com address), no open ports needed.
  # Started only with: docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:80"]
    depends_on:
      - web
    profiles: ["tunnel"]

volumes:
  storage:
  pgsql-data:
